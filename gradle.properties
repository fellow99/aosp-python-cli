# ── 公共元数据（可提交）──────────────────────────────────────────────────────
GROUP=io.github.fellow99
VERSION_NAME=0.1.0
# CLI 制品版本 = 工具上游版本 = Maven 坐标 version（独立 semver，见 docs/000-工程规划.md）。
# 与 node 系 CLI_VERSION 命名口径保持一致。
# 多版本发布：-PCLI_VERSION=<CPython 版本>（见 python-cli.lock.json 的 releases）。
# 当前值为 draft 计划版本；首个真实 CI 构建后按 lock 回写事实。
CLI_VERSION=3.14.0
POM_NAME=python-cli
POM_DESCRIPTION=python command-line executable (libpython_cli.so) for Android arm64-v8a - CPython cross-compiled via PEP 738 Android support with statically linked extension modules and stdlib assets
POM_URL=https://github.com/fellow99/aosp-python-cli
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_SCM_CONNECTION=scm:git:git://github.com/fellow99/aosp-python-cli.git
POM_SCM_DEVELOPMENT_CONNECTION=scm:git:git://github.com/fellow99/aosp-python-cli.git
POM_DEVELOPER_ID=fellow99
POM_DEVELOPER_NAME=fellow99

# 发布门禁（默认关；真实发布时 RELEASE=true + 用户级 gradle.properties 提供 Token/GPG）
RELEASE=false
